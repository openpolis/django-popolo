stages:
  - test
  - release
  - sync

variables:
  DOCKER_IMAGE_PYTHON: python:3.8-buster
  PYPI_TEST_TOKEN: ${PYPI_TEST_TOKEN}
  PYPI_TOKEN: ${PYPI_TOKEN}

flake8:
  image: $DOCKER_IMAGE_PYTHON
  stage: test
  script:
    - pip install -U flake8
    - flake8
  allow_failure: true


pypi_official_release:
  image: $DOCKER_IMAGE_PYTHON
  stage: release
  cache: {}
  script:
    - pip install -U twine wheel
    - python setup.py sdist bdist_wheel
    - twine check dist/*
    - twine upload --verbose --username __token__ --password ${PYPI_TOKEN} dist/*
    - pip install django-popolo
    - pip uninstall django-popolo -y
  only:
    - tags
  when: manual

mirror_to_github:
  stage: sync
  script:
    - git config --global user.name "${GITHUB_USERNAME}"
    - git config --global user.email "${GITHUB_EMAIL}"
    - git remote add github https://${GITHUB_TOKEN}@github.com/openpolis/django-popolo.git
    - git push github --force --all
    - git push github --force --tags
  only:
    - master
    - tags